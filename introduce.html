<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>课程简介</title>
    <style>
        /* 页面主体样式：内边距、字体大小、行高 */
        body {
            padding: 25px;
            font-size: 16px;
            line-height: 1.8;
        }

        /* 标题样式：底部外边距、字体颜色 */
        h3 {
            margin-bottom: 15px;
            color: #f30e0e;
            text-align: center;
        }

        /* 段落样式：底部外边距 */
        p {
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <!-- 页面主标题 -->
    <h3>课程简介</h3>

    <!-- 第一段简介内容 -->
    <p>
        <big>本</big>课程是软件工程专业的一门专业必修课。通过对Web前端三大主流开发技术学习、探究和实践，让学生理解和掌握
        <strong>HTML5、CSS3、JavaScript</strong>等脚本语言的相关知识，通过项目实战和训练培养学生开发和设计Web网站或网页的基本操作技能和工作岗位适应能力。
    </p>

    <!-- 第二段简介内容 -->
    <p>
        <big>通</big>过本课程的学习，使学生理解和掌握HTML(超文本标记语言)中各种常用标记的使用；CSS(层叠样式表)常用属性的使用，如何运用div+CSS对网页进行布局；
        <code>JavaScript</code>脚本语言的基础知识，以及借助于<code>JavaScript</code>语言的强大功能增强网页功能，实现用户交互事件等动态网页功能，为后续课程奠定学习基础。
    </p>
